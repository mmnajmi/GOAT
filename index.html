<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The GOAT Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- MYSTERIOUS OVERLAY SCREEN --- */
        #mystery-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease, visibility 0.8s;
            padding: 2rem;
            text-align: center;
        }

        #mystery-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .mystery-title {
            font-size: 2rem;
            color: #757575;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            animation: pulse 2s infinite alternate;
        }

        .mystery-btn {
            background: transparent;
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
            transition: all 0.3s ease;
            animation: jitter 0.5s infinite alternate;
        }

        .mystery-btn:hover {
            background: #ff3333;
            color: #050508;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6);
            animation-play-state: paused;
        }

        /* --- GOAT CONTENT SCREEN --- */
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            z-index: 2;
        }

        .badge {
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(245, 175, 25, 0.4);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        h1 span {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #c5c6c7;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .goat-emoji {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 1rem;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; text-shadow: 0 0 10px rgba(255,255,255,0.1); }
        }

        @keyframes jitter {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-1px, 1px) scale(0.99); }
            100% { transform: translate(1px, -1px) scale(1.01); }
        }

        /* Background glows */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(79, 172, 254, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            top: 20%;
            left: 20%;
        }

        .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(245, 175, 25, 0.1);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            bottom: 20%;
            right: 20%;
        }
    </style>
</head>
<body>

    <!-- The Mysterious Gatekeeper Screen -->
    <div id="mystery-screen">
        <div class="mystery-title">Your ultimate baseline reality is loading...</div>
        <button class="mystery-btn" onclick="revealGoat()">Continue nigga</button>
    </div>

    <!-- Main Content Hidden Underneath -->
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="container">
        <div class="goat-emoji">🐐</div>
        <div>
            <span class="badge">Official Verdict</span>
        </div>
        <h1>It's Confirmed.<br><span>You Are The GOAT.</span></h1>
        <p>The numbers are in, the charts have been analyzed, and the debate is officially over. Your greatness remains unmatched across the board. -Anas</p>
    </div>

    <script>
        function revealGoat() {
            const overlay = document.getElementById('mystery-screen');
            overlay.classList.add('fade-out');
        }
    </script>

</body>
</html>
